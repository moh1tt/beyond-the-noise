/* Content */
main {

.md-body hr { border: none; border-top: 1px solid var(--border); margin: 24px 0; }

.md-body table { width: 100%; border-collapse: collapse; margin-bottom: 20px; font-size: 13px; }

.md-body h3 + p, .md-body h2 + p { }

ms the sponsorship angle is current, not legacy.\n- BUD Q1 2026 (reported 2026-05-05): revenue $15.3B (+12% YoY), adjusted EPS $0.97 (+20.8% YoY, highest-ever Q1 EPS). Stock rallied >9% intraday to ~$80.84. Moody's upgraded BUD A3 → A2. FY2026 EBITDA guidance reaffirmed +4–8%.\n- DKNG Q1 2026 (reported 2026-05-07): revenue $1,646M (+17% YoY, +$237M), EPS $0.20 vs. $0.17 est. FY2026 guidance maintained: revenue $6.5–6.9B, adjusted EBITDA $700–900M. Live for mobile betting in 27 states + DC + Puerto Rico (~53% of US population).\n- World Cup betting projections (Eilers & Krejcik Gaming via SportsHandle, 2026-06 — **estimates, not realized data**): US sportsbook handle for the tournament ~$2.82B base case, up to $4.3–4.4B high end. DKNG specifically estimated to capture ~$1.1B; DKNG + FanDuel projected ~70% combined US share during the tournament. Globally, $50–60B projected wagered vs. ~$35B in 2022 (CNBC, 2026-06-10, framed as potentially \"the biggest gambling event in history\").\n\n## Tickers\n\n| Ticker | Role in Thesis | Status | Shares (Core Book) | Avg Cost | Current | P&L % | Rating |\n|---|---|---|---|---|---|---|---|\n| [BUD](../tickers/BUD.md) | FIFA World Cup sponsor (partnership through 2030); test case is whether tournament visibility shows up in Q3 numbers | **Sold 2026-06-17** | — | $80.39 | $81.105 (fill) | +0.89% realized | — |\n| [DKNG](../tickers/DKNG.md) | Direct beneficiary of World Cup betting handle surge, currently underway | Watching (Tactical Sleeve — paused, see tactical-book.md) | — | — | $28.51 | — | Watch |\n\n*(Data as of 2026-06-17 close. BUD position closed.)*\n\n## Risks\n\n- **No hard data yet quantifying a World Cup-specific revenue lift for BUD** — the sponsorship angle is real and confirmed, but the financial impact is an inference, not a measured fact. BUD's Q1 2026 strength predates the tournament.\n- **BUD's legacy US brands are declining** independent of this thesis: Bud Light volumes -12.5%, Budweiser -9.5%, Busch -12.8% YoY (Q1 2026). The World Cup tailwind, if real, is a partial offset to a structural domestic decline — not a standalone growth story.\n- **DKNG World Cup estimates are pre-event projections** from industry analysts (Eilers & Krejcik), not confirmed handle data. Actual results could disappoint vs. the $1.1B DKNG-specific estimate.\n- **Regulatory risk** for DKNG remains state-by-state; any adverse legislative/tax development in a major state would matter more than the World Cup tailwind.\n- **Timing**: the catalyst window is short (tournament runs ~2026-06-11 to mid-July). BUD's next earnings (2026-07-30) falls just after the World Cup final — a relatively clean test of the thesis. DKNG's read-through likely won't show up until Q2/Q3 earnings (Q2 likely reported August 2026).\n\n## Catalysts to Watch\n\n- 2026-06-11 → ~2026-07-19: 2026 FIFA World Cup, ongoing now.\n- 2026-07-30: BUD Q2 2026 earnings — first real test of whether World Cup visibility shows up in numbers, reported just after the tournament ends.\n- DKNG Q2 2026 earnings (expected ~August 2026): first read on actual World Cup betting handle vs. the ~$1.1B DKNG estimate.\n- Tactical Sleeve decision: whether to initiate a DKNG position (~$20–25, ~0.7–0.9 fractional shares at current price) while the catalyst is live — pending user confirmation.\n\n## Changelog\n\n- 2026-06-01: BUD position opened on Core Book (3 shares @ $80.39).\n- 2026-06-14: Thesis formalized in repo with research pass. DKNG added as a Tactical Sleeve candidate given the live World Cup catalyst.\n- 2026-06-17: BUD position closed (3 sh @ $81.105, +$2.15 / +0.89% realized). User exited ahead of the afternoon market selloff. DKNG still on watchlist — World Cup is live, tactical sleeve options situation still unresolved. Thesis status: no held positions; DKNG remains a watch candidate.\n", "theses/ai-infrastructure-buildout.md": "# Thesis: AI Infrastructure Buildout — Picks & Shovels\n\n**Status:** Active\n**Conviction:** High (with valuation caveats — see Risks)\n**Created:** 2026-05-11 (positions opened); formalized in repo 2026-06-14\n**Last updated:** 2026-06-17\n\n## Core Thesis\n\nThe AI compute/memory demand surge (AMD, Micron, SanDisk all running hot in 2026) is driving a capex supercycle in semiconductor fabrication and AI datacenter buildout. Rather than betting directly on the chipmakers — which have already re-rated sharply — this thesis targets the \"picks and shovels\" layer that benefits from the *spending*, regardless of which chip company wins: semiconductor equipment/materials suppliers (ENTG, ICHR), electrical infrastructure for fabs and datacenters (POWL), optical interconnect for datacenter networking (GLW), and baseload power for AI datacenter electricity demand (CEG).\n\nFor this to keep working: fab capex and hyperscaler datacenter spend need to keep growing through 2026–2027, and these second-derivative suppliers need to keep converting that spend into revenue/margin without giving it all back to valuation multiple compression.\n\n## Supporting Data\n\n- Micron (MU) fiscal Q2 2026 revenue $23.86B, 74.4% gross margin; guided fiscal Q3 to ~$33.5B revenue, ~81% gross margin, driven by HBM/DRAM/NAND pricing on AI server demand — Parameter.io / market reports, ~May 2026.\n- SanDisk (SNDK) Q3 2026 revenue +96% sequentially to $5.95B; data center revenue +233% sequentially on AI infra adoption (Stargate SSD line) — Motley Fool, 2026-05-11 & 2026-05-24.\n- AMD Q1 FY2026 data center revenue +57% YoY to $5.8B; management projects Data Center segment growth >60%/yr for 3–5 years, anchored by OpenAI's 6GW MI400 deal — CNBC, 2026-05-05.\n- MU and SNDK stock up 154% and 493% YTD as of 2026-05-15 (AlphaSpread) — illustrates how much optimism is already priced into the direct chip names, reinforcing the case for the derivative plays in this thesis.\n\n## Tickers\n\n| Ticker | Role in Thesis | Status | Shares (Core Book) | Avg Cost | Current | P&L % | Rating |\n|---|---|---|---|---|---|---|---|\n| [ENTG](../tickers/ENTG.md) | Semiconductor materials/contamination control — direct fab-capex play, capex cycle largely behind it (operating leverage ahead) | **Sold 2026-06-17** | — | $147.91 | $163.44 (fill) | +10.5% realized | — |\n| [ICHR](../tickers/ICHR.md) | Fluid-delivery subsystems for WFE OEMs (Lam, Applied) — pure-play leverage to the wafer-fab-equipment upcycle | **Sold 2026-06-17** | — | $70.00 | $91.54 (fill) | +30.8% realized | — |\n| [POWL](../tickers/POWL.md) | Electrical switchgear/distribution for datacenters & utilities — direct beneficiary of datacenter electrification | Held | 3.000000 | $313.80 | $294.03 | -6.3% | Hold |\n| [GLW](../tickers/GLW.md) | Optical fiber & connectivity for AI datacenter networking | Held | 2.002839 | $204.79 | $175.40 | -14.3% | Hold |\n| [CEG](../tickers/CEG.md) | Nuclear baseload power, increasingly contracted directly to AI datacenter operators | Held | 1.001570 | $295.40 | $267.17 | -9.6% | Accumulate |\n\n*(Data as of 2026-06-16 close.)*\n\n## Risks\n\n- **Valuation/extrapolation risk**: POWL, ICHR (and the direct names MU/SNDK) have had explosive run-ups priced for a continued upcycle. ICHR's recent 30-day +58% run has pushed it above most analyst targets (~$60–66 vs. $86.87 current). POWL has been flagged by GuruFocus as ~287% overvalued vs. GF Value, with a forward P/E ~62.6x and ~$32.5M of insider selling in the last 3 months with no offsetting buys.\n- **Single demand-driver concentration**: ENTG, ICHR, POWL, GLW, and (partially) CEG all ultimately depend on continued fab capex / hyperscaler datacenter spend — this is a correlated bet across five tickers, not five independent ones.\n- **Wide analyst disagreement on ENTG**: targets range from a Goldman Sachs Sell at $95 to a Mizuho Outperform at $180 — over a 90% spread, signaling genuine uncertainty about cycle durability.\n- **Margin/execution risk**: POWL's gross/operating margins compressed in Q2 FY2026 despite record backlog (supply-chain costs); ICHR remains GAAP-unprofitable.\n- **CEG sentiment disconnect**: fundamentals are strong (Q1 2026 adjusted EPS $2.74, +28% YoY, beat consensus; FY26 guidance reaffirmed $11–12) but one source (TIKR) cites CEG down ~20% YTD 2026 — possibly rate-sensitivity / utility-sector rotation independent of the AI story. Unverified, flagged for monitoring.\n- **Macro overlay**: the Fed is in a \"higher-for-longer\" stance (see [macro/dashboard.md](../macro/dashboard.md)) with the next FOMC decision 2026-06-16/17. Capex-heavy, rate-sensitive names (CEG, POWL) are more exposed to a \"no cuts, longer\" outcome than the materials/equipment names.\n\n## Catalysts to Watch\n\n- 2026-06-16/17 — FOMC decision (rate-sensitive names: CEG, POWL).\n- ICHR Q2 2026 results — guided revenue $290–310M with positive GAAP and non-GAAP EPS; a beat/miss here is a read on whether the WFE upcycle is broadening or narrow.\n- POWL — integration progress on the >$400M data-center infrastructure award (runs through FY2028) and whether margins stabilize.\n- GLW — capacity scale-up on the NVIDIA optical-connectivity partnership (announced 2026-05-06, stock +14% on the news) and whether the two new hyperscaler agreements get quantified.\n- CEG — any news on the ~1GW nuclear uprate plan (incl. Braidwood/Byron 135MW) and new PPA announcements.\n\n## Changelog\n\n- 2026-05-11: Thesis opened. Sold PLTR (13.486836 sh @ $135.0671) and BKNG (2.678021 sh @ $160.697) on Core Book, rotated proceeds into ENTG (3 @ $147.91), POWL (2 @ $320.21), GLW (2 @ $204.80), CEG (1 @ $295.43).\n- 2026-05-14: Added POWL (+1 @ $300.99) and ICHR (2 @ $70.00). (LIN was also bought this day but tagged Unassigned — see `portfolio/core-book.md`.)\n- 2026-05-20: CEG DRIP +0.001570 sh.\n- 2026-06-03: GLW DRIP +0.002839 sh.\n- 2026-06-14: Thesis formalized in repo with full research pass; all five tickers rated, CEG moved to Accumulate given fundamentals/price disconnect (flagged for re-check).\n- 2026-06-17: ICHR upgraded to **Trim** (from ividend declared at $1.60/share (payable 2026-06-18, record date 2026-06-04).\n- Q1 2026: sales $8,781M, net income $1,857M, double-digit EPS growth, $7.10B project backlog. FY2026 guidance: adjusted EPS $17.60–17.90 (+7–9%), $5.0–5.5B capex.\n- **AI/semiconductor angle (secondary)**: long-term (10–20 year) ultra-high-purity nitrogen supply contracts with Intel, TSMC, and Samsung; $2.5–3B of backlog tied partly to new fab construction starting revenue in 2026. Separately, a 2026-04-17 report (Motley Fool) flagged a helium shortage linked to the Iran conflict as a potential constraint for the chip industry, where Linde is a key supplier — more an \"input-scarcity beneficiary\" angle than a pure capex story.\n- Also positioned as SpaceX's primary industrial gas/liquid oxygen partner, with potential upside from commercial space-sector growth through 2040.\n- **Flag**: Citi's Quant team named LIN one of the most \"crowded\" long positions in chemicals — a contrarian risk worth monitoring. Analyst PT raised to $525.49 from $516.41.\n\n## Rating\n\n**Current: Hold** — a high-quality, dividend-growing compounder with a real but secondary AI/semiconductor fab-supply angle and an SpaceX/space-economy kicker. Most of FY2026 growth is driven by healthcare, clean energy, and chemicals — don't overweight the AI narrative here. Good anchor for a future \"quality compounders\" thesis.\n\n### Rating history\n- 2026-06-14: Hold — initial rating on repo formalization.\n\n## Risks\n- \"Crowded long\" positioning (per Citi) could amplify a drawdown if sentiment in industrial gases turns.\n- AI/semiconductor angle is real but secondary — don't size this as an AI-infra bet.\n", "tickers/ICHR.md": "# ICHR — Ichor Holdings, Ltd.\n\n**Last updated:** 2026-06-14 | **Data as of:** 2026-06-12 (Fri close)\n\n## Snapshot\n\n- **What they do:** Fluid-delivery subsystems for semiconductor capital equipment — a tier-2 supplier to wafer-fab-equipment (WFE) OEMs like Lam Research and Applied Material  2026-06-14: Hold — initial rating on repo formalization.\n\n## Risks\n- Cyclical wafer-fab-equipment (WFE) spending — a pause in fab tool orders hits this directly.\n- China export-control exposure.\n- The Goldman-vs-Mizuho target spread means the market hasn't converged on whether the \"capex cycle is over, margins expand\" story or a \"cyclical peak\" story is correct.\n", "tickers/DKNG.md": "# DKNG — DraftKings Inc.\n\n**Last updated:** 2026-06-14 | **Data as of:** 2026-06-12 (Fri close)\n\n## Snapshot\n\n- **What they do:** Online sportsbook and iGaming operator — live for mobile betting in 27 states + DC + Puerto Rico (~53% of US population), iGaming in 5 states (~11%).\n- **Thesis link(s):** [Consumer Events 2026](../theses/consumer-events-2026.md)\n- **Position status:** Not held. **Top candidate for the Tactical Sleeve (••••3551)** — pending user go/no-go.\n\n## Current Numbers\n\n| Metric | Value |\n|---|---|\n| Current price | $28.99 (2026-06-12, down from prev close $30.02) |\n| Position | None |\n| Tactical sizing | ~$20–25 → ~0.7–0.9 fractional shares |\n\n## Fundamentals & Recent News\n\n- Q1 2026 (reported 2026-05-07): revenue $1,646M (+17% YoY, +$237M), EPS $0.20 vs. $0.17 est. (beat) — driven by efficient customer acquisition and higher Sportsbook net revenue margin.\n- FY2026 guidance maintained: revenue $6.5–6.9B, adjusted EBITDA $700–900M.\n- **2026 FIFA World Cup betting projections** (Eilers & Krejcik Gaming via SportsHandle, 2026-06 — **estimates, not realized data**): US sportsbook handle for the tournament ~$2.82B base case, up to $4.3–4.4B high end. DKNG specifically estimated to capture ~$1.1B; DKNG + FanDuel projected at ~70% combined US share during the tournament. Globally, $50–60B projected wagered vs. ~$35B in 2022 (CNBC, 2026-06-10).\n- **Analyst reinforcement since kickoff** (week of 2026-06-08–12): sell-side commentary named DKNG the \"clearest winner\" in sports betting for the World Cup window, with BofA (using Paysafe data) flagging that ~1 in 5 legal-state bettors plan to place their first-ever sports wager during the tournament — framed as a major customer-acquisition opportunity, not just a handle spike. DKNG running 2,000+ markets per match (~half live) plus a new Spanish-language app tied to its Telemundo partnership. Stock still pulled back ~3.4% on 2026-06-12 ($30.02→$28.99) despite the bullish framing — no negative catalyst identified, looks like normal noise/profit-taking, but worth noting as a slightly better entry if/when the trade is confirmed.\n\n## Rating\n\n**Current: Watch** — strong standalone fundamentals (Q1 beat, maintained guidance) plus a live, time-bound catalyst (World Cup running 2026-06-11 through mid-July) make this the top Tactical Sleeve candidate. The estimates above are pre-event projections, not confirmed — actual read-through won't show up until Q2/Q3 earnings (~August 2026). Needs explicit confirmation before any trade is drafted.\n\n### Rating history\n- 2026-06-14: Watch — added as Tactical Sleeve candidate on repo formalization.\n\n## Risks\n- World Cup handle estimates are analyst projections, not realized data — actual results could disappoint vs. the ~$1.1B DKNG-specific estimate.\n- State-by-state regulatory/tax risk remains the dominant long-term risk for DKNG, independent of any single event.\n- Financial read-through from the World Cup likely won't be visible until Q2/Q3 2026 earnings.\n", "tickers/CEG.md": "# CEG — Constellation Energy Corporation\n\n**Last updated:** 2026-06-14 | **Data as of:** 2026-06-12 (Fri close)\n\n## Snapshot\n\n- **What they do:** Largest U.S. nuclear power operator — carbon-free baseload power increasingly contracted directly to AI datacenter operators.\n- **Thesis link(s):** [AI Infrastructure Buildout](../theses/ai-infrastructure-buildout.md)\n- **Position status:** Held in Core Book (••••8652) — 1.001570 shares @ $295.40 avg cost (1 share bought 2026-05-11 @ $295.43; +0.001570 via DRIP on 2026-05-20). **Smallest dollar position in the Core Book.**\n\n## Current Numbers\n\n| Metric | Value |\n|---|---|\n| Current price | $253.76 (2026-06-12) |\n| Avg cost | $295.40 |\n| Market value | $254.16 |\n| Unrealized P&L | -$41.65 / -14.1% |\n\n## Fundamentals & Recent News\n\n- Q1 2026: adjusted EPS $2.74, beat consensus $2.61, +28% YoY from $2.14 (MarketBeat/Globe and Mail).\n- New deals: a Calpine subsidiary signed a 380MW agreement with CyrusOne in Texas, bringing the total CyrusOne relationship to >1,100MW. Long-term PPAs already in place with Microsoft, Meta, and the U.S. government.\n- Growth plan: ~1GW of nuclear uprates over the next decade (including 135MW at Braidwood/Byron, Illinois) backed by $3.9B capex, supporting >5,650MW of long-term clean energy agreements.\n- FY2026 guidance reaffirmed at $11–12 adjusted EPS, with a 2029 target of $11.40–11.90 (~20% CAGR from 2026 base).\n- **Flag**: one source (TIKR) claims CEG is down ~20% YTD 2026 despite this fundamental strength — unverified against a second source, but worth monitoring as a possible sentiment/fundamentals disconnect.\n\n## Rating\n\n**Current: Accumulate** — the -14.1% drawdown from cost looks disconnected from genuinely strong and *accelerating* fundamentals (EPS beat, expanding PPA book, reaffirmed double-digit EPS growth guidance through 2029). Most likely explanation is rate-sensitivity for a capex-heavy utility model in the current \"higher for longer\" environment (see [macro/dashboard.md](../macro/dashboard.md)). This is the smallest dollar position in the book — there's room to add on weakness if the fundamental thesis holds, but worth waiting for the 2026-06-16/17 FOMC outcome first.\n\n### Rating history\n- 2026-06-14: Accumulate — initial rating on repo formalization; flagged for re-check post-FOMC.\n\n## Risks\n- Regulatory/political risk around nuclear uprate approvals.\n- Interest-rate sensitivity given the capex-heavy model — a \"no cuts, longer\" Fed path is a headwind.\n- AI-datacenter power-demand growth assumptions underlying the PPA growth story could prove too aggressive if hyperscaler capex decelerates.\n", "tickers/BUD.md": "# BUD — Anheuser-Busch InBev SA/NV\n\n**Last updated:** 2026-06-14 | **Data as of:** 2026-06-12 (Fri close)\n\n## Snapshot\n\n- **What they do:** World's largest brewer (Budweiser, Corona, Stella Artois, Michelob Ultra, Busch, and 500+ brands). Long-standing FIFA World Cup sponsor.\n- **Thesis link(s):** [Consumer Events 2026](../theses/consumer-events-2026.md)\n- **Position status:** Held in Core Book (••••8652) — 3.000000 shares @ $80.39 avg cost (bought 2026-06-01).\n\n## Current Numbers\n\n| Metric | Value |\n|---|---|\n| Current price | $82.885 (2026-06-12) |\n| Avg cost | $80.39 |\n| Market value | $248.66 |\n| Unrealized P&L | +$7.49 / +3.1% |\n\n## Fundamentals & Recent News\n\n- FIFA partnership **extended through 2030**, now also covering the Women's World Cup (TIKR, 2026-05) — confirms the World Cup sponsorship angle is current.\n- Q1 2026 (reported 2026-05-05): revenue $15.3B (+12% YoY), adjusted EPS $0.97 (+20.8% YoY, highest-ever Q1 EPS). Stock rallied >9% intraday to ~$80.84. Moody's upgraded BUD's credit rating A3 → A2. FY2026 EBITDA guidance reaffirmed +4–8%.\n- Strength is uneven: Corona +16% revenue ex-Mexico, non-alcohol beer (Corona Cero, Michelob Ultra Zero) +27% — but legacy U.S. brands declining: Bud Light volumes -12.5%, Budweiser -9.5%, Busch -12.8% YoY (Q1 2026).\n- Stock closed +3.04% on 2026-06-09 (TradingKey).\n- **Next earnings: 2026-07-30** — falls just after the World Cup final, a relatively clean test of the thesis.\n\n## Rating\n\n**Current: Accumulate** — confirmed FIFA sponsorship through 2030, a strong Q1 beat, and a credit upgrade, with the World Cup catalyst live right now (tournament started 2026-06-11). The legacy-brand decline is a real structural headwind, but international diversification (Corona) and the non-alcohol push are offsetting it. July 30 earnings is the clean test.\n\n### Rating history\n- 2026-06-14: Accumulate — initial rating on repo formalization.\n\n## Risks\n- Legacy U.S. brand decline (Bud Light, Budweiser, Busch) is structural, not cyclical — the World Cup tailwind is a partial offset, not a fix.\n- No hard data yet quantifying a World-Cup-specific revenue lift — this remains an inference from the sponsorship relationship.\n- FX and input-cost sensitivity typical of a global consumer staples name.\n", "macro/dashboard.md": "# Macro Dashboard\n\n**Last updated:** 2026-06-16 | Refresh via WebSearch each session per `CLAUDE.md` → Session Startup Protocol.\n\n## Current Regime: \"Higher for Longer,\" Energy-Driven Inflation Spike — Hawkish Shift Imminent\n\nThe Fed is on hold despite earlier market expectations of 2026 rate cuts, because inflation re-accelerated on an energy/geopolitical shock (US-Iran tensions). This is a **stagflation-adjacent** backdrop: growth-sensitive and rate-sensitive names (e.g., SOFI, and partially CEG/POWL) are being punished for dashed rate-cut hopes, while defensive/staples and industrials with pricing power (WMT, LIN) are holding up better.\n\nNote: broad semiconductor stocks rallied ~3.8% on 2026-06-15, apparently on easing geopolitical tensions — this lifted ENTG, GLW, ICHR, POWL, and CEG.\n\n## Key Levels & Dates\n\n| Metric | Value | Source / Date |\n|---|---|---|\n| Fed funds target range | 3.50%–3.75% (unchanged) | Held at FOMC; 99.4% probability of hold at this meeting (CME FedWatch, Polymarket 2026-06) |\n| **FOMC decision** | **2026-06-17, 2:00 PM ET ← TOMORROW** | Federal Reserve calendar; IndexBox, FinanceCalendar 2026-06 |\n| Following FOMC | 2026-07-28/29 | Federal Reserve calendar |\n| Fed Chair | Kevin Warsh (took office 2026-05-15) — **this is his first FOMC as Chair** | adds policy-direction uncertainty |\n| CPI (May 2026, released 2026-06-10) | Headline +0.5% MoM / +4.2% YoY; Core +0.2% MoM / +2.9% YoY | CNBC, Wolf Street, 2026-06-10 |\n| Energy prices | +3.9% MoM / +23.5% YoY — linked to US-Iran hostilities | Wolf Street, 2026-06-10 |\n| 10-year Treasury yield | ~4.55% | 2026-06-10 |\n\n## FOMC Preview — 2026-06-17\n\n**Rate**: No change expected (0.6% implied probability of hike). The meeting's real significance is the dot plot — Warsh's first SEP as Chair.\n\n**Dot plot risk**: The March 2026 SEP showed rates on hold through 2026 (set under Powell). The June update, under Warsh, is widely expected to shift to at least neutral — and multiple previews suggest the median dot will show **at least one hike in 2026**. This would represent a hawkish surprise vs. market consensus of \"on hold all year.\" — IndexBox, FinanceCalendar, 2026-06\n\n**Portfolio impact**:\n- **SOFI**: Most exposed. A hawkish dot plot confirms \"higher for longer\" and removes the rate-cut thesis underpinning a thesis-or-exit decision. Truist already cut target to $17 (right at current price). Securities investigation overhang adds noise.\n- **CEG/POWL**: Secondary exposure to rate sensitivity and capex cost-of-capital. CEG is rated Accumulate; a hawkish surprise would keep near-term pressure on the stock despite strong fundamentals.\n- **Less affected**: ENTG, ICHR, WMT, LIN — less rate-sensitive.\n\n## Portfolio Read-Through\n\n- The FOMC dot plot tomorrow (June 17, 2pm ET) is the single most important near-term catalyst for this portfolio. Revisit SOFI rating and CEG's Accumulate rating after the announcement.\n- Semiconductor rally (2026-06-15, ~+3.8% avg) — driven partly by easing geopolitical tensions — provided a meaningful tailwind to ENTG (+8.2%), GLW (+4.8%), and the broader AI Infrastructure Buildout thesis. This may have partly front-run the FOMC.\n- Revisit `tickers/SOFI.md` rating explicitly after the FOMC decision. The thesis-or-exit decision has been complicated further by a new securities investigation and a Truist target cut to $17.\n\n## Open Questions / To Refresh Next Session\n\n- **Outcome of 2026-06-17 FOMC** — rate decision and dot plot (hike signals vs. hold). This is the critical read.\n- Whether the Iran-linked energy spike is easing or persisting.\n- New Fed Chair Warsh's early policy communication tone.\n", "journal/2026-06-17.md": "# Journal — 2026-06-17\n\n**Session type:** Morning briefing / daily report\n**Data as of:** 2026-06-16 close; pre-market 2026-06-17 noted\n\n---\n\n## Flagged Movers (>3% vs. last recorded price on 2026-06-15)\n\n| Symbol | 6/15 Close | 6/16 Close | Change | Driver |\n|---|---|---|---|---|\n| ENTG | $162.89 | $151.61 | **-6.9%** | Giveback from June 11–15 rally (+22.7% run on JSR/EUV deal); recovering in pre-market to ~$155.44 |\n| GLW | $187.88 | $177.42 | **-5.6%** | Pulled back from Amazon deal surge; recovering pre-market to ~$180.45 |\n| ICHR | $89.47 | $85.77 | **-4.1%** | CEO + Director sold shares (10b5-1 plans); stock still up 22.5% from our cost |\n| POWL | $303.53 | $292.70 | **-3.6%** | CEO sold at $272.64 (10b5-1); margin pressure in Q2 flagged; dividend $0.09/share paid today |\n| SOFI | $17.13 | $17.71 | **+3.4%** | SoFiUSD stablecoin launch June 11; offset by Truist target cut to $17 (Hold) |\n\n---\n\n## Key News Findings\n\n### ENTG — Thesis intact, giveback from a rip\n- June 11: +12.4% on JSR cross-licensing deal for EUV metal oxide resist patents (ended active patent challenge, opened collaboration path)\n- June 15: +8.2% more in a broad semiconductor rally, closing $162.89\n- June 16: -6.9% giveback; pre-market 6/17 recovering to $155.44\n- Mizuho raised PT to $180 (Outperform); Lone Pine boosted stake\n- Our position: +2.5% on cost. No thesis break. **Rating: Hold.**\n\n### GLW — Amazon deal validates thesis; still underwater\n- June 8: +9% on multibillion-dollar Amazon optical fiber/cable/connectivity contract for U.S. datacenter buildout — direct thesis confirmation\n- June 16: closed $177.42, pre-market $180.45 (recovering)\n- Headwinds: Wall Street Zen downgraded to Hold June 6; insider selling $54.1M in shares over 3 months\n- Our position: -13.4% on cost ($204.79 avg). The Amazon deal is the first concrete revenue proof point for the thesis. But the entry was expensive and insiders are selling. **Rating: Hold. No add until stock digests the big run.**\n\n### ICHR — Active trim candidate\n- CEO Philip Barros sold 13,705 shares at $70.19 on June 4 (10b5-1 plan set up March 2026)\n- Director Laura Black sold 20,000 shares at $75.02 on June 2 (10b5-1)\n- Stock subsequently ran to $90+ on semiconductor sector momentum, now at $85.77 close\n- Fundamentals: negative margins, negative FCF; TipRanks Neutral; stock up 311% YTD in the sector\n- Our position: +22.5% from $70.00 cost. CEO sold at essentially our entry price, then the stock ripped 27% further. We're in good shape.\n- **Rating upgraded to Trim. A partial trim here (~1 share) locks in gains on a fundamentally weak name before any WFE cycle uncertainty re-prices it. Recommendation below.**\n\n### POWL — Margin pressure; CEO selling; dividend arriving today\n- CEO Brett Cope sold 4,440 shares at $272.64 on June 11 (10b5-1, set up Nov 2025)\n- Q2 FY2026: gross profit and operating margins contracted; supply-chain disruptions in utility/commercial sectors → project delays\n- **Quarterly dividend: $0.09/share, payable today (June 17) to shareholders of record May 20** — 3 shares = $0.27 arriving today\n- Stock up 150.84% YTD despite the pullback; fair value estimate ~$225 by one analyst\n- Our position: -6.7% on cost ($313.80 avg). The stock went well past fair value, CEO is selling, and margins are compressing. **Rating: Hold. Watch next earnings closely — if margins don't recover, this may need to move to Trim.**\n\n### SOFI — New optionality, but no re-rating yet\n- June 11: launched SoFiUSD stablecoin — first U.S. national bank to issue a stablecoin inside a regulated banking app (Ethereum + Solana)\n- Truist cut PT from $20 → $17, maintaining Hold; Q2 revenue guided weaker for loan/tech platform\n- Regulatory scrutiny ongoing (June 2: short-seller/legal hea |\n|---|---|---|---|---|---|\n| 18:00:41 | ENTG | Sell | 3 | $163.435 | +$46.58 (+10.5%) |\n| 18:00:52 | ICHR | Sell | 2 | $91.540 | +$43.08 (+30.8%) |\n| 18:02:43 | WMT | Sell | 4 | $118.015 | +$11.58 (+2.5%) |\n| 18:02:53 | LIN | Sell | 1 | $517.385 | +$3.85 (+0.75%) |\n| 18:03:04 | BUD | Sell | 3 | $81.105 | +$2.15 (+0.89%) |\n| 18:11:32 | NVDA | Buy | 9 | $206.385 | (new position) |\n\n**Total realized gain today: +$107.24**\n\n### Timing Alpha\nSold before the afternoon down-move. ENTG closed at $157.34 (filled at $163.44 — $18.29 saved). ICHR closed at $89.45 (filled at $91.54 — $4.18 saved). Net alpha vs. holding to close: ~+$24.82.\n\n### The Pivot: NVDA\nProceeds from the five sells (~$1,906) were largely recycled into 9 shares of NVDA at $206.385. NVDA closed at $204.65 (-0.84% from entry), then recovered in after-hours to $206.68 — essentially flat on the day.\n\nThis is a meaningful portfolio shift: from a diversified \"picks and shovels\" indirect AI play (ENTG, ICHR, WMT, LIN, BUD) into the primary AI chip company directly. NVDA at $1,841.85 market value is now the single largest position in the book (44.7% of equity).\n\n**Open question for next session:** Does NVDA belong in the AI Infrastructure Buildout thesis (changing its character), or does it warrant a new \"Direct AI\" thesis? The original picks-and-shovels thesis rationale was specifically to avoid concentration in the chip winner — that rationale is now inverted.\n\n### Current Book (EOD 2026-06-17)\n- NVDA: 9 sh, $206.39 cost, $204.65 close, -0.8%\n- SOFI: 38.32 sh, $25.94 cost, $17.42 close, -32.8%\n- POWL: 3 sh, $313.80 cost, $294.03 close, -6.3%\n- GLW: 2.003 sh, $204.79 cost, $175.40 close, -14.3%\n- CEG: 1.002 sh, $295.40 cost, $267.17 close, -9.6%\n- Cash: $57.91\n- Account NAV: $4,108.03\n", "journal/2026-06-16.md": "# Session Journal — 2026-06-16\n\n**Session type:** Startup analysis / price refresh\n**Data as of:** 2026-06-15 close + 2026-06-16 pre-market where noted\n\n---\n\n## I // Build navigation
const sidebar = document.getElementById('sidebar');
NAV.forEach(section => {
  const hdr = document.createElement('div');
  hdr.className = 'section-header';
  hdr.textContent = section.section;
  sidebar.appendChild(hdr);
  section.items.forEach(item => {
    const a = document.createElement('a');
    a.href = '#' + encodeURIComponent(item.key);
    a.dataset.key = item.key;
    a.textContent = item.title;
    a.onclick = (e) => { e.preventDefault(); loadFile(item.key); closeMobile(); };
    sidebar.appendChild(a);
  });
});

// Post-process P&L coloring in tables
function colorTables() {
  document.querySelectorAll('.md-body td').forEach(td => {
    const t = td.textContent.trim();
    if (/^[+]/.test(t) && /%|\$/.test(t)) td.style.color = 'var(--green)';
    else if (/^[-]/.test(t) && /%|\$/.test(t)) td.style.color = 'var(--red)';
  });
  // Highlight ⚠️ headings
  document.querySelectorAll('.md-body h3').forEach(h => {
    if (h.textContent.includes('⚠️') || h.textContent.includes('Alert') || h.textContent.includes('Flag')) {
      h.style.color = 'var(--yellow)';
    }
  });
  document.querySelectorAll('.md-body h2').forEach(h => {
    if (h.textContent.includes('⚠️')) h.style.color = 'var(--yellow)';
  });
}

// Render markdown
function loadFile(key) {
  const content = FILES[key];
  if (!content) { document.getElementById('content').innerHTML = '<p>File not found.</p>'; return; }
  document.getElementById('content').innerHTML = marked.parse(content);
  colorTables();
  // Update active link
  document.querySelectorAll('nav.sidebar a').forEach(a => {
    a.classList.toggle('active', a.dataset.key === key);
  });
  // Update hash
  history.replaceState(null, '', '#' + encodeURIComponent(key));
  // Scroll to top
  document.querySelector('main').scrollTop = 0;
}

// Handle hash on load
function loadFromHash() {
  const hash = decodeURIComponent(window.location.hash.slice(1));
  if (hash && FILES[hash]) loadFile(hash);
  else loadFile(DEFAULT);
}

// Mobile menu
function toggleMenu() {
  document.getElementById('sidebar').classList.toggle('open');
}
function closeMobile() {
  document.getElementById('sidebar').classList.remove('open');
}

// Close sidebar on outside click (mobile)
document.querySelector('main').addEventListener('click', closeMobile);

window.addEventListener('hashchange', loadFromHash);
loadFromHash();
